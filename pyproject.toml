[build-system]
# Pinned so that release builds are reproducible (it decides the metadata
# version, which twine must accept). Update it together with the release extra.
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "reposentinel"
dynamic = ["version"]  # from src/reposentinel/__init__.py (see [tool.hatch.version])
description = "Local, offline security audit for software repositories: risky files, hard-coded credential patterns, and unsafe GitHub Actions workflows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/reposentinel/webui/THIRD_PARTY_LICENSES.txt"]
requires-python = ">=3.12"
authors = [{ name = "ItzMeVishwas" }]
keywords = ["security", "audit", "secrets", "github-actions", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]
# Runtime dependencies, kept deliberately small:
#   typer  - command-line interface (argument parsing, help, testing helpers)
#   rich   - readable terminal report (also used by Typer for help output)
#   PyYAML - safe parsing of GitHub Actions workflow files (SafeLoader only)
#   Jinja2 - HTML report with automatic escaping of untrusted text
# Lower bounds were verified by running the test suite against them (Python
# 3.13, Click 8.5). Typer 0.15 crashes on --help with current Click, and
# Typer 0.16-0.17 return exit code 1 instead of 2 for usage errors.
dependencies = [
    "typer>=0.18",
    "rich>=13.7",
    "PyYAML>=6.0.2",
    "Jinja2>=3.1.6",
]

[project.optional-dependencies]
dev = [
    # Older Typer test helpers trigger Click deprecation warnings, which the
    # test suite treats as errors.
    "typer>=0.26",
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]
# Tools for building and checking release archives (scripts/build_release.py).
release = [
    "build>=1.3",
    # twine 7 understands the metadata version (2.5) that hatchling 1.32 writes.
    "twine>=7.0",
]

[project.scripts]
reposentinel = "reposentinel.cli:main"

# Release builds: run `python scripts/build_release.py`, which builds the web
# interface (frontend/, npm ci + npm run build) BEFORE the Python packages and
# then checks both archives with scripts/check_dist.py.
#
# The interface's production build (src/reposentinel/webui/static/) is
# generated and git-ignored, so it is listed as an artifact to be included.
# The sdist carries it too, so a wheel built from the sdist does not need
# Node.js. Without it, `reposentinel ui` explains how to build it; every
# other command works.
[tool.hatch.version]
path = "src/reposentinel/__init__.py"

[tool.hatch.build]
exclude = [
    "**/node_modules",
    "**/.claude-flow",
    "**/__pycache__",
    "**/*.tsbuildinfo",
    "**/.env",
    "**/.env.*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reposentinel"]
artifacts = ["src/reposentinel/webui/static/**"]

[tool.hatch.build.targets.sdist]
include = [
    "src", "tests", "docs", "scripts", "frontend", "pyproject.toml",
    "README.md", "LICENSE", "SECURITY.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "CHANGELOG.md",
]
# The README screenshots are for the repository page, not the source archive.
exclude = ["docs/images"]
artifacts = ["src/reposentinel/webui/static/**"]

# ---------------------------------------------------------------- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

# ------------------------------------------------------------------ ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # modern Python syntax
    "S",   # bandit: security smells
    "SIM", # simplifications
    "RUF", # ruff-specific checks
]

[tool.ruff.lint.per-file-ignores]
# Tests use plain asserts and build synthetic, fake credentials on purpose.
"tests/**" = ["S101", "S105", "S106", "S108"]
"scripts/**" = ["S105"]

# ------------------------------------------------------------------ mypy ---
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
