name: Bug report
description: Something RepoSentinel does wrong (including false positives and false negatives).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security problem in RepoSentinel itself?** Do not open an issue: follow SECURITY.md.
        **Never paste real credentials**, even revoked ones. Use synthetic values.
  - type: input
    id: version
    attributes:
      label: RepoSentinel version
      description: Output of `python -m reposentinel --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the exact command, or the steps in the web interface.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: A minimal synthetic repository that reproduces it
      description: File names and contents (with fake values), or `reposentinel demo` plus your changes.
