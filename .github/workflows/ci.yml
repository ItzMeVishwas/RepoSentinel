# Continuous integration for RepoSentinel.
#
# Security choices:
# * Triggered by push and pull_request only. Pull requests from forks then
#   run with a read-only token and no secrets, so code from a pull request
#   never runs with privileged credentials. pull_request_target and
#   workflow_run are deliberately not used.
# * The GITHUB_TOKEN can only read repository contents, and actions/checkout
#   does not store it in .git/config (persist-credentials: false).
# * Actions are pinned to full commit SHAs. The comment gives the reviewed
#   release; update both together (Dependabot can do this).
# * No secrets are used. Nothing is uploaded, cached or published (no npm
#   or pip caches either: dependencies come from the lockfile and pins).
#   The only downloads besides dependencies are the official SARIF schema
#   (job "sarif") and one Gitleaks release (job "gitleaks"), each checked
#   against a pinned SHA-256.
# * npm runs with --ignore-scripts, so no dependency's install script runs.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The macOS jobs are new and not (yet) required checks for main.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Some tests start the real `reposentinel ui`, which serves the built web
      # interface (and, correctly, refuses to start without it).
      - name: Build the web interface
        id: ui
        working-directory: frontend
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      # The Python checks below run even when the web interface build, lint or
      # type checking failed (the job still fails), so one failing check cannot
      # hide the others' results. Only the tests need the built interface.
      - name: Install RepoSentinel with development tools
        id: install
        if: ${{ !cancelled() }}
        run: python -m pip install -e ".[dev]"

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ruff check .

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ruff format --check .

      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m mypy

      - name: Run tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.ui.outcome == 'success' }}
        env:
          # Linux and macOS can create symbolic links without extra privileges,
          # so the symbolic-link tests must run there: with this set, failing
          # to create a link fails the test instead of skipping it.
          REPOSENTINEL_REQUIRE_SYMLINK_TESTS: ${{ runner.os != 'Windows' && '1' || '0' }}
        run: python -m pytest -ra

      # The scripts of publish.yml, run with bash as on the Linux and Windows
      # runners that publish.yml uses. These tests are in
      # .github/workflow-tests, so that they are not part of the release
      # archives.
      - name: Test the publish workflow
        if: ${{ !cancelled() && steps.install.outcome == 'success' && runner.os != 'macOS' }}
        run: python -m pytest -ra .github/workflow-tests

      - name: Check the generated rules reference
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/generate_rules_doc.py --check

      - name: Scan this repository with RepoSentinel
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m reposentinel scan . --no-color

  frontend:
    name: Web interface (TypeScript check and production build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install the exact dependencies from the lockfile
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Production build
        working-directory: frontend
        run: npm run build

  package:
    name: Build, check, install and smoke-test the package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install the release tools
        run: python -m pip install "build==1.3.0" "twine==7.0.0"

      # First, a wheel WITHOUT the web interface (as built from a checkout that
      # skipped npm): every command but `ui` must work, and `ui` must explain.
      - name: Build a wheel without the web interface
        run: python -m build --wheel --outdir "$RUNNER_TEMP/dist-no-ui"

      - name: Install it in a fresh environment and smoke-test it
        run: |
          python -m venv "$RUNNER_TEMP/env-no-ui"
          "$RUNNER_TEMP/env-no-ui/bin/python" -m pip install "$RUNNER_TEMP"/dist-no-ui/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/env-no-ui/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_installed.py" --no-ui

      # Then the release: web interface first, then the sdist and wheel, then
      # twine check and scripts/check_dist.py (which requires the interface).
      - name: Build the release archives
        run: python scripts/build_release.py --outdir dist

      - name: Install the wheel in a fresh environment and smoke-test it
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/reposentinel" --version
          "$RUNNER_TEMP/wheel-env/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_installed.py"

  browser:
    name: Web interface end to end (real Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install RepoSentinel
        run: python -m pip install -e .

      - name: Build the web interface
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      # The test drives the runner's preinstalled Google Chrome with
      # puppeteer-core (nothing is downloaded) against the real server, on
      # synthetic repositories only. Hosted Ubuntu runners may not allow
      # Chrome's sandbox for unprivileged users, hence --no-sandbox here.
      - name: Run the end-to-end test
        working-directory: frontend
        env:
          CHROME_PATH: /usr/bin/google-chrome
          E2E_CHROME_NO_SANDBOX: "1"
          PYTHON: python
        run: npm run e2e

  # The same test in Firefox, over WebDriver BiDi. Not a required check. The
  # checks that need Chrome's DevTools protocol are reported as skipped.
  browser-firefox:
    name: Web interface end to end (real Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install RepoSentinel
        run: python -m pip install -e .

      - name: Build the web interface
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      # The runner's preinstalled Firefox; nothing is downloaded.
      - name: Run the end-to-end test
        working-directory: frontend
        env:
          E2E_BROWSER: firefox
          PYTHON: python
        run: |
          export FIREFOX_PATH="$(readlink -f "$(command -v firefox)")"
          "$FIREFOX_PATH" --version
          npm run e2e

  sarif:
    name: SARIF output against the official SARIF 2.1.0 schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # jsonschema is a development tool here, not a RepoSentinel dependency.
      - name: Install RepoSentinel and the schema validator
        run: python -m pip install -e . "jsonschema==4.25.1"

      # The OASIS schema is downloaded, not stored in this repository; the
      # script refuses any file whose SHA-256 differs from the reviewed one.
      - name: Download the official SARIF 2.1.0 schema (errata 01)
        run: >-
          curl --fail --silent --show-error --location --max-time 60
          --output "$RUNNER_TEMP/sarif-schema-2.1.0.json"
          https://docs.oasis-open.org/sarif/sarif/v2.1.0/errata01/os/schemas/sarif-schema-2.1.0.json

      - name: Validate SARIF from the command line for synthetic repositories
        run: python scripts/validate_sarif.py --schema "$RUNNER_TEMP/sarif-schema-2.1.0.json"

  gitleaks:
    # Not a required check. Runs the Gitleaks integration against a real
    # Gitleaks release: scripts/fetch_gitleaks.py downloads one pinned release
    # from the official release page and refuses it unless its SHA-256 matches.
    name: Gitleaks integration (real Gitleaks, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install RepoSentinel with development tools
        run: python -m pip install -e ".[dev]"

      - name: Download Gitleaks and check its SHA-256
        run: python scripts/fetch_gitleaks.py "${{ runner.temp }}/gitleaks"

      - name: Run the real-Gitleaks tests
        env:
          REPOSENTINEL_GITLEAKS_DIR: ${{ runner.temp }}/gitleaks
          REPOSENTINEL_REQUIRE_GITLEAKS_TESTS: "1"
        run: python -m pytest -ra tests/test_gitleaks_real.py

  minimum-dependencies:
    name: Lowest supported dependency versions (Linux, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Some tests start the real `reposentinel ui`, which serves the built web
      # interface (and, correctly, refuses to start without it).
      - name: Build the web interface
        id: ui
        working-directory: frontend
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Install the lowest supported versions
        # Keep these in sync with the lower bounds in pyproject.toml.
        run: |
          python -m pip install "typer==0.18.0" "rich==13.7.0" "PyYAML==6.0.2" "Jinja2==3.1.6" "pytest>=8.3"
          python -m pip install --no-deps -e .

      - name: Run tests
        env:
          REPOSENTINEL_REQUIRE_SYMLINK_TESTS: "1"
        # Typer releases before 0.26 call a deprecated Click function from their
        # test helpers. The suite treats every warning as an error, so only
        # deprecation warnings are relaxed here (see pyproject.toml).
        run: python -m pytest -ra -W "ignore::DeprecationWarning"

  # Rebuilds the release commit in the reference build environment of
  # publish.yml (the same action) and fails unless it gives exactly the two
  # archives and SHA-256 values in expected-archives.txt. This shows, for
  # every change, that GitHub's Windows runner still reproduces the archives
  # the maintainer verified. It cannot publish: it has only the read-only
  # token, uses no secrets, no environment and no OpenID Connect token, and
  # uploads nothing.
  reference-build:
    name: Reference build of the release archives (Windows, SHA-256)
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out this commit (it defines the reference build)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false

      - name: Read the release commit and the expected SHA-256
        id: expected
        env:
          EXPECTED_FILE: head/.github/actions/reference-build/expected-archives.txt
        run: |
          set -euo pipefail
          export LC_ALL=C
          # Prints the value of key $1; the key must appear exactly once.
          value() {
            [ "$(grep -c "^$1=" "$EXPECTED_FILE")" -eq 1 ] ||
              { echo "::error::$1 must appear exactly once in $EXPECTED_FILE." >&2; return 1; }
            sed -n "s/^$1=//p" "$EXPECTED_FILE"
          }
          commit=$(value commit)
          version=$(value version)
          wheel=$(value wheel-sha256)
          sdist=$(value sdist-sha256)
          [[ $commit =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::commit must be a full commit SHA."; exit 1; }
          [[ $version =~ ^[0-9]+(\.[0-9]+)*((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$ ]] ||
            { echo "::error::version must be a normalised version."; exit 1; }
          [[ $wheel =~ ^[0-9a-f]{64}$ && $sdist =~ ^[0-9a-f]{64}$ ]] ||
            { echo "::error::The SHA-256 values must be 64 lower-case hexadecimal characters."; exit 1; }
          {
            echo "commit=$commit"
            echo "wheel-name=reposentinel_scanner-$version-py3-none-any.whl"
            echo "sdist-name=reposentinel_scanner-$version.tar.gz"
            echo "wheel-sha256=$wheel"
            echo "sdist-sha256=$sdist"
          } >> "$GITHUB_OUTPUT"
          echo "Release commit $commit, version $version"
          echo "Expected SHA-256 of the wheel:          $wheel"
          echo "Expected SHA-256 of the source archive: $sdist"

      # The commit is written out here, not taken from a step output, so that
      # nothing computed while the workflow runs decides which code is
      # checked out and built. The next step checks that it is the commit of
      # expected-archives.txt.
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6da5bd86167a4241b746b46534f0f27a5bafcc04
          path: release
          persist-credentials: false

      - name: Check that it is the commit of expected-archives.txt
        env:
          EXPECTED_COMMIT: ${{ steps.expected.outputs.commit }}
        run: |
          set -euo pipefail
          actual=$(git -C release rev-parse HEAD)
          echo "Checked out $actual"
          if [ "$actual" != "$EXPECTED_COMMIT" ]; then
            echo "::error::ci.yml and expected-archives.txt name different release commits."
            exit 1
          fi

      - name: Build the release commit in the reference build environment
        uses: ./head/.github/actions/reference-build
        with:
          source: release
          outdir: ${{ runner.temp }}/reference-dist

      - name: Compare the archives with the expected SHA-256
        env:
          WHEEL_NAME: ${{ steps.expected.outputs.wheel-name }}
          SDIST_NAME: ${{ steps.expected.outputs.sdist-name }}
          EXPECTED_WHEEL: ${{ steps.expected.outputs.wheel-sha256 }}
          EXPECTED_SDIST: ${{ steps.expected.outputs.sdist-sha256 }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          shopt -s dotglob nullglob
          fail() {
            echo "::error::$1"
            echo "Nothing will be uploaded."
            exit 1
          }
          check_expected_values() {
            [[ $EXPECTED_WHEEL =~ ^[0-9a-f]{64}$ && $EXPECTED_SDIST =~ ^[0-9a-f]{64}$ ]] ||
              fail "The expected SHA-256 values are not 64 lower-case hexadecimal characters."
            [[ $WHEEL_NAME =~ ^reposentinel_scanner-[0-9a-z.]+-py3-none-any\.whl$ &&
              $SDIST_NAME =~ ^reposentinel_scanner-[0-9a-z.]+\.tar\.gz$ ]] ||
              fail "The expected file names are not valid."
          }
          # Fails unless folder $1 holds exactly the two expected regular files
          # with the expected SHA-256. The names are compared as listed on disk,
          # so this is exact on Windows too (whose file names ignore case).
          check_folder() {
            local entries=("$1"/*) name actual
            [ "${#entries[@]}" -eq 2 ] ||
              fail "$1 must hold exactly the two archives; it holds ${#entries[@]} entries."
            [ "$(printf '%s\n' "${entries[@]##*/}" | sort)" = \
              "$(printf '%s\n' "$WHEEL_NAME" "$SDIST_NAME" | sort)" ] ||
              fail "$1 does not hold exactly $WHEEL_NAME and $SDIST_NAME."
            for name in "$WHEEL_NAME" "$SDIST_NAME"; do
              [ -f "$1/$name" ] && [ ! -L "$1/$name" ] ||
                fail "$name is missing from $1 or is not a regular file."
            done
            sha256sum -- "$1/$WHEEL_NAME" "$1/$SDIST_NAME"
            # The file is read from standard input, so the output holds no file
            # name: for a name with a backslash (RUNNER_TEMP on Windows),
            # sha256sum would escape the line and put a backslash before the hash.
            actual=$(sha256sum < "$1/$WHEEL_NAME" | cut -d " " -f 1)
            [ "$actual" = "$EXPECTED_WHEEL" ] ||
              fail "The wheel's SHA-256 is not the expected value."
            actual=$(sha256sum < "$1/$SDIST_NAME" | cut -d " " -f 1)
            [ "$actual" = "$EXPECTED_SDIST" ] ||
              fail "The source archive's SHA-256 is not the expected value."
          }
          # End of the checks shared with the publish workflow.
          check_expected_values
          check_folder "$RUNNER_TEMP/reference-dist"
