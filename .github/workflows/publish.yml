# Publishes a RepoSentinel release to TestPyPI or PyPI.
#
# How it is used:
# * Only started by hand: Actions > Publish > Run workflow, on `main` or on a
#   release tag `v*`. Choose the index (TestPyPI first) and enter the SHA-256
#   of the wheel and of the source archive that the maintainer built and
#   verified locally from the same commit.
# * The build job rebuilds both archives from that commit, checks them, and
#   stops unless both hashes equal the expected values. Only then does the
#   publish job upload exactly those files.
#
# Security choices:
# * Trusted publishing (OpenID Connect): no PyPI token or other secret is
#   stored anywhere. PyPI accepts the upload only from this repository, this
#   workflow file and the matching GitHub environment ("testpypi" or
#   "pypi"), as registered by the maintainer on (Test)PyPI. Give each
#   environment a required reviewer so every upload needs an approval.
# * id-token: write is granted to the publish job only, which runs no project
#   code: it downloads the verified archives and uploads them. The build job
#   can only read repository contents, and actions/checkout does not store
#   the token in .git/config (persist-credentials: false).
# * Workflow inputs reach the shell through environment variables, never as
#   expressions inside a script.
# * Actions are pinned to full commit SHAs, like in ci.yml.
# * npm runs with --ignore-scripts (scripts/build_release.py).

name: Publish

on:
  workflow_dispatch:
    inputs:
      index:
        description: "Package index to upload to (use testpypi first)"
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      wheel-sha256:
        description: "Expected SHA-256 of reposentinel_scanner-<version>-py3-none-any.whl"
        type: string
        required: true
      sdist-sha256:
        description: "Expected SHA-256 of reposentinel_scanner-<version>.tar.gz"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Build the archives and compare their SHA-256
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install the release tools
        run: python -m pip install "build==1.3.0" "twine==7.0.0"

      - name: Build the release archives
        run: python scripts/build_release.py --outdir dist

      - name: Check the archives
        run: |
          python -m twine check --strict dist/*
          python scripts/check_dist.py dist

      - name: Compare the SHA-256 with the expected values
        env:
          EXPECTED_WHEEL: ${{ inputs.wheel-sha256 }}
          EXPECTED_SDIST: ${{ inputs.sdist-sha256 }}
        run: |
          set -euo pipefail
          sha256sum dist/*
          wheel=$(sha256sum dist/reposentinel_scanner-*-py3-none-any.whl | cut -d " " -f 1)
          sdist=$(sha256sum dist/reposentinel_scanner-*.tar.gz | cut -d " " -f 1)
          status=0
          if [ "$wheel" != "$EXPECTED_WHEEL" ]; then
            echo "::error::The wheel's SHA-256 is not the expected value."
            status=1
          fi
          if [ "$sdist" != "$EXPECTED_SDIST" ]; then
            echo "::error::The source archive's SHA-256 is not the expected value."
            status=1
          fi
          if [ "$status" -ne 0 ]; then
            echo "Nothing will be uploaded. Rebuild locally from this commit and compare."
          fi
          exit "$status"

      - name: Keep the verified archives for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Upload to ${{ inputs.index }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.index }}
      url: ${{ inputs.index == 'pypi' && 'https://pypi.org/p/reposentinel-scanner' || 'https://test.pypi.org/p/reposentinel-scanner' }}
    permissions:
      id-token: write
    steps:
      - name: Download the verified archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: dist/

      - name: Upload to TestPyPI
        if: inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Upload to PyPI
        if: inputs.index == 'pypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
